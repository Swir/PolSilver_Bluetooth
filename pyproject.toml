[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polsilver-bluetooth"
version = "2.0.0"
description = "Cross-platform Bluetooth LE diagnostics for devices you own or administer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Swir"}]
dependencies = [
  "bleak>=1.1,<2",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyinstaller>=6.12,<7",
  "pillow>=11,<12",
]

[project.scripts]
polsilver-bluetooth = "polsilver.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
